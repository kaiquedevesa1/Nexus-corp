<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Atlas Mobility">
  <defs>
    <linearGradient id="am-wash" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4AA8FF" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#4AA8FF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#05070A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="am-glow" cx=".7" cy=".7" r=".6">
      <stop offset="0" stop-color="#4AA8FF" stop-opacity=".26"/>
      <stop offset="1" stop-color="#4AA8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="am-foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070A" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070A" stop-opacity=".92"/>
    </linearGradient>
    <pattern id="am-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#4AA8FF" stroke-opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1200" height="1500" fill="#080E16"/>
