    <rect x="56" y="436" width="268" height="122" rx="18" fill="#4AA8FF" fill-opacity=".12" stroke="#4AA8FF" stroke-opacity=".45" stroke-width="2"/>
    <text x="86" y="498" font-family="monospace" font-size="36" fill="#4AA8FF">12 min</text>
