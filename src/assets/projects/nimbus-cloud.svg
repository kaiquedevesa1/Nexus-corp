<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Nimbus Cloud">
  <defs>
    <linearGradient id="nc-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9E4A" stop-opacity=".26"/>
      <stop offset=".6" stop-color="#FF9E4A" stop-opacity=".07"/>
      <stop offset="1" stop-color="#05070A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nc-glow" cx=".26" cy=".2" r=".6">
      <stop offset="0" stop-color="#FF9E4A" stop-opacity=".3"/>
      <stop offset="1" stop-color="#FF9E4A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nc-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9E4A" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FF9E4A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nc-foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070A" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070A" stop-opacity=".92"/>
    </linearGradient>
    <pattern id="nc-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#FF9E4A" stroke-opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1200" height="1500" fill="#120C08"/>
  <rect width="1200" height="1500" fill="url(#nc-grid)"/>
  <rect width="1200" height="1500" fill="url(#nc-wash)"/>
  <rect width="1200" height="1500" fill="url(#nc-glow)"/>

  <g transform="translate(150 190)">
    <rect width="900" height="470" rx="22" fill="#160F0A" fill-opacity=".9" stroke="#FF9E4A" stroke-opacity=".3" stroke-width="2"/>
    <path d="M0 70h900" stroke="#FF9E4A" stroke-opacity=".22" stroke-width="2"/>
    <circle cx="40" cy="35" r="8" fill="#FF9E4A" fill-opacity=".6"/>
    <circle cx="70" cy="35" r="8" fill="#FF9E4A" fill-opacity=".35"/>
    <circle cx="100" cy="35" r="8" fill="#FF9E4A" fill-opacity=".2"/>
    <text x="790" y="46" font-family="monospace" font-size="26" fill="#FF9E4A">LIVE</text>
    <path d="M50 380 170 300 290 336 410 216 530 268 650 160 770 196 850 130v250H50Z" fill="url(#nc-area)"/>
    <path d="M50 380 170 300 290 336 410 216 530 268 650 160 770 196 850 130" fill="none" stroke="#FF9E4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="850" cy="130" r="13" fill="#F4F8FA"/>
    <path d="M50 380h800" stroke="#F4F8FA" stroke-opacity=".12" stroke-width="2"/>
    <text x="50" y="440" font-family="monospace" font-size="27" fill="#F4F8FA" fill-opacity=".35" letter-spacing="4">THROUGHPUT / 24H</text>
  </g>

  <g transform="translate(150 740)">
    <rect width="900" height="86" rx="10" fill="#160F0A" fill-opacity=".85" stroke="#FF9E4A" stroke-opacity=".4" stroke-width="2"/>
    <rect y="110" width="900" height="86" rx="10" fill="#160F0A" fill-opacity=".85" stroke="#FF9E4A" stroke-opacity=".22" stroke-width="2"/>
    <rect y="220" width="900" height="86" rx="10" fill="#160F0A" fill-opacity=".85" stroke="#FF9E4A" stroke-opacity=".22" stroke-width="2"/>
    <circle cx="46" cy="43" r="10" fill="#FF9E4A"/>
    <circle cx="46" cy="153" r="10" fill="#FF9E4A"/>
    <circle cx="46" cy="263" r="10" fill="#FF9E4A" fill-opacity=".45"/>
    <path d="M100 43h420M100 153h330M100 263h480" stroke="#F4F8FA" stroke-opacity=".18" stroke-width="10" stroke-linecap="round"/>
    <text x="740" y="54" font-family="monospace" font-size="27" fill="#FF9E4A" fill-opacity=".8">eu-west</text>
    <text x="740" y="164" font-family="monospace" font-size="27" fill="#FF9E4A" fill-opacity=".8">sa-east</text>
    <text x="740" y="274" font-family="monospace" font-size="27" fill="#FF9E4A" fill-opacity=".45">us-east</text>
  </g>

  <text x="150" y="1310" font-family="monospace" font-size="150" font-weight="700" fill="#FF9E4A" fill-opacity=".9" letter-spacing="8">NC</text>

  <rect y="1100" width="1200" height="400" fill="url(#nc-foot)"/>
</svg>
